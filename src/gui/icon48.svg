<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Icona di RetroArchiver, 32 e 48 pixel: floppy che scende nel cassetto
       d'archivio metallico, stile Luna di XP. Da qui si genera retroarchiver.ico
       con tests/xp/make_ico.ps1 (Windows, Edge). -->
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa2ff"/><stop offset=".45" stop-color="#2a63d8"/><stop offset="1" stop-color="#123a96"/>
    </linearGradient>
    <linearGradient id="gShutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d5dbe4"/><stop offset="1" stop-color="#9aa4b2"/>
    </linearGradient>
    <linearGradient id="gLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e1cf"/>
    </linearGradient>
    <linearGradient id="gArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9be36a"/><stop offset=".5" stop-color="#3fae2a"/><stop offset="1" stop-color="#1f7a14"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f5"/><stop offset=".55" stop-color="#b9c2cf"/><stop offset="1" stop-color="#7e8a9b"/>
    </linearGradient>
    <linearGradient id="gMetalTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd6df"/>
    </linearGradient>
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="25" cy="45" rx="21" ry="2.6" fill="url(#gShadow)"/>
  <path d="M3.5 30.5 8 26h32l4.5 4.5z" fill="url(#gMetalTop)" stroke="#4d5866" stroke-width="1" stroke-linejoin="round"/>
  <path d="M8.5 26.8h31" stroke="#5a6574" stroke-width="1.2"/>
  <g transform="translate(5 1) rotate(-8 14 14)">
    <path d="M1.5 2.5a2 2 0 0 1 2-2h19l5 5v20a2 2 0 0 1-2 2h-22a2 2 0 0 1-2-2z" fill="url(#gBlue)" stroke="#0a2766" stroke-width="1"/>
    <rect x="7" y="0.8" width="13" height="8.5" rx=".8" fill="url(#gShutter)" stroke="#5d6878" stroke-width=".7"/>
    <rect x="15.2" y="2" width="3" height="6" rx=".4" fill="#2b3340"/>
    <rect x="5" y="13" width="18" height="12.5" rx=".8" fill="url(#gLabel)" stroke="#8d876f" stroke-width=".6"/>
    <path d="M7.5 16.5h12M7.5 19.5h9" stroke="#3c6fd6" stroke-width="1"/>
    <path d="M3 2.6a1.2 1.2 0 0 1 1.2-1.2h2" fill="none" stroke="#bcd4ff" stroke-width=".8" stroke-linecap="round"/>
  </g>
  <rect x="3.5" y="30.5" width="41" height="13" rx="1.5" fill="url(#gMetal)" stroke="#4d5866" stroke-width="1"/>
  <rect x="4.5" y="31.3" width="39" height="4" rx="1" fill="url(#gGloss)"/>
  <rect x="17" y="33" width="14" height="4.5" rx=".6" fill="#fdfcf6" stroke="#6b7685" stroke-width=".7"/>
  <path d="M19 35.2h10" stroke="#9aa4b2" stroke-width=".8"/>
  <path d="M19 39.5h10a1.5 1.5 0 0 1 0 3H19a1.5 1.5 0 0 1 0-3z" fill="#5a6574" stroke="#3a4350" stroke-width=".6"/>
  <path d="M35 6h6v11h4.5L38 26.5 30.5 17H35z" fill="url(#gArrow)" stroke="#145a0c" stroke-width="1" stroke-linejoin="round"/>
  <path d="M36 7h2.2v10.5" fill="none" stroke="#d9ffc4" stroke-width="1" stroke-linecap="round" opacity=".8"/>
</svg>
